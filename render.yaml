# Blueprint do Render (Infraestrutura como código).
# New + -> Blueprint -> selecione este repositório. O Render cria o banco
# PostgreSQL e o Web Service Docker e liga as variáveis abaixo automaticamente.

databases:
  - name: literarium-db
    plan: free
    databaseName: literarium

services:
  - type: web
    name: literarium
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # Conexão do PostgreSQL gerenciado, injetada pelo Render.
      - key: DATABASE_URL
        fromDatabase:
          name: literarium-db
          property: connectionString
      # Chave secreta gerada pelo Render (não precisa preencher).
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Superusuário inicial do /admin — preenchidos no "Apply" do Blueprint.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
